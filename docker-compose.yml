# docker-compose.yml - Environnement de développement local

services:

  app:
    build: .
    container_name: planifio_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_NAME=planifio
      - DB_USER=planifio
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: planifio_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=planifio
      - POSTGRES_USER=planifio
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planifio"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
