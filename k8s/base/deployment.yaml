apiVersion: apps/v1
kind: Deployment
metadata:
  name: planifio
  labels:
    app: planifio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planifio
  template:
    metadata:
      labels:
        app: planifio
    spec:
      containers:
        - name: planifio
          image: ghcr.io/seydousylla/planifio:staging-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: planifio
            - name: DB_USER
              value: planifio
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planifio-secret
                  key: dbPassword
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
