# k8s/base/cluster-issuer.yaml

# cert-manager doit déjà être installé sur le cluster
# avant d'appliquer cette ressource; sans lui, le type ClusterIssuer n'existe pas.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: seydousylla180@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: traefik
