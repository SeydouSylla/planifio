spring:
  application:
    name: planifio

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:planifio}
    username: ${DB_USER:planifio}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
