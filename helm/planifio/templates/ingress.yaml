apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planifio-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: ["{{ .Values.domain }}"]
      secretName: planifio-tls
  rules:
    - host: "{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: planifio
                port:
                  number: 8080
